name: DemoQA automation - manual trigger
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        required: true
        type: choice
        options:
          - smoke
          - regression
        default: smoke
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: browser-actions/setup-chrome@v1
      - name: Run selected suite serially
        run: |
          if [ "${{ inputs.suite }}" = "regression" ]; then
            mvn -B test -Dsurefire.suiteXmlFiles=testng-regression.xml -Dheadless=true
          else
            mvn -B test -Dheadless=true
          fi
      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demoqa-test-results
          path: |
            target/surefire-reports/
            target/screenshots/
          if-no-files-found: ignore
